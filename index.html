<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Ассистент</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#1a1a2e;color:#fff;height:100vh;display:flex;flex-direction:column}
.header{background:#16213e;padding:15px;text-align:center}
.header h1{font-size:18px;color:#00d4ff}
.chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;line-height:1.4;word-wrap:break-word}
.user{align-self:flex-end;background:#0f3460;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:#2d2d44;border-bottom-left-radius:4px}
.input{background:#16213e;padding:15px;display:flex;gap:10px;align-items:center}
#inp{flex:1;background:#0f3460;border:none;padding:12px 16px;border-radius:25px;color:#fff;font-size:16px;outline:none}
button{background:#00d4ff;border:none;color:#1a1a2e;width:45px;height:45px;border-radius:50%;cursor:pointer;font-size:20px}
.attach{background:#2d2d44;color:#fff}
img{max-width:200px;border-radius:10px;margin-top:8px}
.load{color:#888;font-style:italic;align-self:flex-start}
#modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:1000}
.mc{background:#16213e;padding:20px;border-radius:15px;width:90%;max-width:400px}
.mc h2{color:#00d4ff;margin-bottom:10px}
.mc input{width:100%;padding:10px;margin:10px 0;background:#0f3460;border:1px solid #2d2d44;border-radius:8px;color:#fff}
.mc button{width:100%;border-radius:8px}
.hidden{display:none!important}
a{color:#00d4ff}
</style>
</head>
<body>
<div id="modal"><div class="mc">
<h2>🔑 Настройка API</h2>
<p style="color:#888;font-size:14px">Ключ Gemini API (бесплатно):<br><a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a></p>
<input type="text" id="key" placeholder="Вставьте API ключ...">
<button onclick="saveKey()">Сохранить</button>
</div></div>
<div class="header"><h1>🤖 AI Ассистент</h1></div>
<div class="chat" id="chat"></div>
<div class="input">
<input type="file" id="file" accept="image/*" style="display:none" onchange="upload(this)">
<button class="attach" onclick="document.getElementById('file').click()">📷</button>
<input type="text" id="inp" placeholder="Сообщение..." onkeypress="if(event.key=='Enter')send()">
<button onclick="send()">➤</button>
</div>
<script>
let key=localStorage.getItem('gk')||'';
if(key)document.getElementById('modal').classList.add('hidden');
function saveKey(){let k=document.getElementById('key').value.trim();if(k){key=k;localStorage.setItem('gk',k);document.getElementById('modal').classList.add('hidden');}}
function add(role,content,img){let c=document.getElementById('chat');let d=document.createElement('div');d.className='msg '+role;let h='';if(img)h+='<img src="'+img+'">';if(content)h+=content.replace(/\n/g,'<br>');d.innerHTML=h;c.appendChild(d);c.scrollTop=c.scrollHeight;}
function upload(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>send(e.target.result);r.readAsDataURL(f);}
async function send(img){
let inp=document.getElementById('inp');let t=inp.value.trim();
if(!t&&!img)return;
add('user',t,img);inp.value='';
add('load','Думаю...');let msgs=document.querySelectorAll('.load');
try{
let parts=[{text:t||'Разбери эту электрическую схему'}];
if(img)parts.push({inline_data:{mime_type:'image/jpeg',data:img.split(',')[1]}});
let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:parts}]})});
let d=await r.json();
if(d.error)throw new Error(d.error.message);
msgs[msgs.length-1].remove();
add('ai',d.candidates[0].content.parts[0].text);
}catch(e){msgs[msgs.length-1].remove();add('ai','Ошибка: '+e.message);}
}
</script>
</body>
</html>
